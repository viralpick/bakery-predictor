# 목적함수 축 A/B — expected(center) 모델 L1 vs L2
#
# 왜: 평가 지표(WAPE/WPE)는 **합계 기준**이라 평균성 대상을 가리키는데 L1은 조건부
#     중앙값을 맞춘다. 이 불일치가 요일별 편향(수요일 +5%)과 예측 압축(std비 1.24)의
#     후보 원인으로 실측됐다. 후처리 보정 대신 **모델 층위에서** 판정한다.
#     (요일은 요일당 260샘플 = 모델이 배워야 하는 것. 후처리로 덮으면 결함을 가린다.
#      event_prior는 학습창당 2~5샘플이라 원리적으로 다른 경우다.)
#
# 두 forecaster가 **같은 fold·같은 데이터**를 쓰므로 목적함수 효과만 분리된다.
# 생산량(quantile) 모델은 양쪽 동일 — 발주 정책이 섞이지 않는다(테스트로 보장).
#
# ⚠️ 헤드라인 아님. 헤드라인 = experiments/gwangyo_default.yaml (category_total = L1).
name: gwangyo_objective_ab
data:
  source: real
  store: store_gw01
target: adjusted_demand_unit
forecaster: [category_total, category_total_l2]
layers: [event_prior]
event_priors: gwangyo
window:
  scheme: expanding
  n_folds: 52
  window_days: 730
  horizon_days: 7
alpha: 0.8
production_q: 0.85
