# experiments/gwangyo_compare.yaml — category vs distributional 비교(수동 실행, 52-fold=수 분 소요)
name: gwangyo_compare
data:
  source: real
  store: store_gw01
target: adjusted_demand_unit
forecaster: [category_total, distributional_total]
layers: [event_prior]
event_priors: gwangyo
window:
  scheme: expanding
  n_folds: 52
  window_days: 730
  horizon_days: 7
alpha: 0.8
production_q: 0.85
